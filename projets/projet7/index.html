<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de Cycle Menstruel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #555;
            font-weight: 600;
            font-size: 0.95em;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .results {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .results.active {
            display: block;
        }

        .result-item {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #666;
            font-size: 0.9em;
        }

        .result-value {
            color: #333;
            font-size: 1.1em;
            font-weight: 600;
            color: #667eea;
        }

        .calendar-section {
            display: flex;
            flex-direction: column;
        }

        .calendar-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .calendar {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .calendar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-header button {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            font-size: 0.9em;
        }

        .calendar-header h3 {
            font-size: 1.2em;
            flex: 1;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e0e0e0;
            padding: 1px;
        }

        .weekday {
            background: #f0f0f0;
            padding: 10px;
            text-align: center;
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e0e0e0;
            padding: 1px;
        }

        .day {
            background: white;
            padding: 15px;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }

        .day:hover {
            background: #f5f5f5;
        }

        .day.other-month {
            color: #ccc;
            background: #fafafa;
        }

        .day.period {
            background: #ff6b9d;
            color: white;
        }

        .day.fertile {
            background: #ffd93d;
            color: #333;
        }

        .day.ovulation {
            background: #ff1744;
            color: white;
            font-weight: bold;
        }

        .day.today {
            border: 2px solid #667eea;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .legend {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌸 Suivi de Cycle Menstruel</h1>
            <p>Suivez votre cycle menstruel et planifiez votre vie</p>
        </header>

        <div class="content">
            <div class="form-section">
                <h2>Vos Informations</h2>

                <div class="form-group">
                    <label for="cycleLenght">Longueur de votre cycle (jours)</label>
                    <input type="number" id="cycleLenght" min="21" max="35" value="28" placeholder="Ex: 28">
                </div>

                <div class="form-group">
                    <label for="periodDate">Date de dernière période</label>
                    <input type="date" id="periodDate">
                </div>

                <div class="form-group">
                    <label for="periodDays">Durée de votre période (jours)</label>
                    <input type="number" id="periodDays" min="1" max="7" value="5" placeholder="Ex: 5">
                </div>

                <button onclick="calculerCycle()">Calculer</button>

                <div class="results" id="results">
                    <div class="result-item">
                        <div class="result-label">Prochaine période</div>
                        <div class="result-value" id="nextPeriod">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Jour d'ovulation estimé</div>
                        <div class="result-value" id="ovulationDay">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Fenêtre fertile</div>
                        <div class="result-value" id="fertileWindow">-</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Jours jusqu'à la prochaine période</div>
                        <div class="result-value" id="daysUntil">-</div>
                    </div>
                </div>
            </div>

            <div class="calendar-section">
                <h2>Calendrier</h2>
                <div class="calendar">
                    <div class="calendar-header">
                        <button onclick="previousMonth()">← Précédent</button>
                        <h3 id="monthYear">Décembre 2024</h3>
                        <button onclick="nextMonth()">Suivant →</button>
                    </div>

                    <div class="weekdays">
                        <div class="weekday">Lun</div>
                        <div class="weekday">Mar</div>
                        <div class="weekday">Mer</div>
                        <div class="weekday">Jeu</div>
                        <div class="weekday">Ven</div>
                        <div class="weekday">Sam</div>
                        <div class="weekday">Dim</div>
                    </div>

                    <div class="days" id="calendarDays"></div>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff6b9d;"></div>
                        <span>Période</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff1744;"></div>
                        <span>Ovulation</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffd93d;"></div>
                        <span>Fertile</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let lastPeriodDate = null;
        let cycleLength = 28;
        let periodLength = 5;

        // Initialiser avec la date d'aujourd'hui
        document.getElementById('periodDate').valueAsDate = new Date();

        function calculerCycle() {
            const periodDateInput = document.getElementById('periodDate').value;
            cycleLength = parseInt(document.getElementById('cycleLenght').value) || 28;
            periodLength = parseInt(document.getElementById('periodDays').value) || 5;

            if (!periodDateInput) {
                alert('Veuillez entrer une date');
                return;
            }

            lastPeriodDate = new Date(periodDateInput);

            // Calculer la prochaine période
            const nextPeriod = new Date(lastPeriodDate);
            nextPeriod.setDate(nextPeriod.getDate() + cycleLength);

            // Calculer le jour d'ovulation (généralement 14 jours avant la prochaine période)
            const ovulationDate = new Date(nextPeriod);
            ovulationDate.setDate(ovulationDate.getDate() - 14);

            // Fenêtre fertile (5 jours avant ovulation + jour d'ovulation)
            const fertileStart = new Date(ovulationDate);
            fertileStart.setDate(fertileStart.getDate() - 5);
            const fertileEnd = new Date(ovulationDate);
            fertileEnd.setDate(fertileEnd.getDate() + 1);

            // Jours jusqu'à la prochaine période
            const today = new Date();
            const daysUntil = Math.ceil((nextPeriod - today) / (1000 * 60 * 60 * 24));

            // Afficher les résultats
            document.getElementById('nextPeriod').textContent = formatDate(nextPeriod);
            document.getElementById('ovulationDay').textContent = formatDate(ovulationDate);
            document.getElementById('fertileWindow').textContent = `${formatDate(fertileStart)} à ${formatDate(fertileEnd)}`;
            document.getElementById('daysUntil').textContent = daysUntil > 0 ? daysUntil + ' jours' : 'Bientôt!';

            document.getElementById('results').classList.add('active');
            afficherCalendrier();
        }

        function afficherCalendrier() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthYear').textContent = 
                currentDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;

            const calendarDaysDiv = document.getElementById('calendarDays');
            calendarDaysDiv.innerHTML = '';

            // Jours du mois précédent
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startingDayOfWeek - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'day other-month';
                day.textContent = prevMonthLastDay - i;
                calendarDaysDiv.appendChild(day);
            }

            // Jours du mois actuel
            for (let i = 1; i <= daysInMonth; i++) {
                const day = document.createElement('div');
                day.className = 'day';
                day.textContent = i;

                const currentDayDate = new Date(year, month, i);
                const today = new Date();

                // Marquer aujourd'hui
                if (currentDayDate.toDateString() === today.toDateString()) {
                    day.classList.add('today');
                }

                // Si une date de période est définie
                if (lastPeriodDate) {
                    // Période menstruelle
                    const periodEnd = new Date(lastPeriodDate);
                    periodEnd.setDate(periodEnd.getDate() + periodLength);

                    if (currentDayDate >= lastPeriodDate && currentDayDate <= periodEnd) {
                        day.classList.add('period');
                    }

                    // Ovulation (14 jours avant la prochaine période)
                    const nextPeriod = new Date(lastPeriodDate);
                    nextPeriod.setDate(nextPeriod.getDate() + cycleLength);
                    const ovulationDate = new Date(nextPeriod);
                    ovulationDate.setDate(ovulationDate.getDate() - 14);

                    if (currentDayDate.toDateString() === ovulationDate.toDateString()) {
                        day.classList.add('ovulation');
                    }

                    // Fenêtre fertile
                    const fertileStart = new Date(ovulationDate);
                    fertileStart.setDate(fertileStart.getDate() - 5);
                    const fertileEnd = new Date(ovulationDate);
                    fertileEnd.setDate(fertileEnd.getDate() + 1);

                    if (currentDayDate > fertileStart && currentDayDate < fertileEnd && 
                        currentDayDate.toDateString() !== ovulationDate.toDateString()) {
                        day.classList.add('fertile');
                    }
                }

                calendarDaysDiv.appendChild(day);
            }

            // Jours du mois suivant
            const totalCells = calendarDaysDiv.children.length;
            const remainingCells = 42 - totalCells;
            for (let i = 1; i <= remainingCells; i++) {
                const day = document.createElement('div');
                day.className = 'day other-month';
                day.textContent = i;
                calendarDaysDiv.appendChild(day);
            }
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            afficherCalendrier();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            afficherCalendrier();
        }

        function formatDate(date) {
            return date.toLocaleDateString('fr-FR', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        // Initialiser le calendrier
        afficherCalendrier();
    </script>
</body>
</html>
