<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pulse</title>
    <link rel="stylesheet" href="oth.css">
</head>
<body>

    <main>
        <section class="nazuna">
            <div class="logo">
                <img src="icon.svg" alt="logo">
            </div>

            <div class="tiitre">
                <h2>Pulse</h2>
                <p class="message_itachi">Messagerie intantanée & sécurisées</p>
            </div>

            <div class="connexion_inscription">
                <div class="inscription">
                    <a href="#" class="yamori_connexion">Connexion</a>
                </div>
                <div class="inscription">
                    <a href="#" class="yamori_inscription">Inscription</a>
                </div>

            </div>

            <div class="formulaire">
                <form action="">

                   <div class="formulaire_naruto1">
                        <label for="email">ADRESSE E-MAIL</label>
                        <input type="email" placeholder="vous@exemple.com" required>
                   </div>

                   <div class="formulaire_naruto2">
                        <label for="password">MOT DE PASSE</label>
                        <input type="password" placeholder="........." required>
                   </div> 
                </form>
            </div>

           <input type="button" value="Se connecter" class="btn">

            <div class="footer">
                <p class="footer_end_nazuna">
                    Démo : <span class="nanakusa">demo@exemple.com</span> / n'importe quel mot de passe
                </p>
            </div>

        </section>

        
    </main>
    
    
</body>
</html>
